<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1f27"/>
      <stop offset="1" stop-color="#0b0c10"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <g id="keys">
      <!-- Four zones, left to right, three key rows and a space bar. -->
      <g fill="#e4002b"><rect x="40" y="78" width="34" height="28" rx="6"/><rect x="40" y="114" width="34" height="28" rx="6"/><rect x="40" y="150" width="34" height="28" rx="6"/></g>
      <g fill="#ff6a00"><rect x="82" y="78" width="34" height="28" rx="6"/><rect x="82" y="114" width="34" height="28" rx="6"/></g>
      <g fill="#ffc400"><rect x="124" y="78" width="34" height="28" rx="6"/><rect x="124" y="114" width="34" height="28" rx="6"/><rect x="166" y="150" width="50" height="28" rx="6"/></g>
      <g fill="#00a3ff"><rect x="166" y="78" width="50" height="28" rx="6"/><rect x="166" y="114" width="50" height="28" rx="6"/></g>
      <rect x="82" y="150" width="76" height="28" rx="6" fill="url(#space)"/>
    </g>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a00"/>
      <stop offset="1" stop-color="#ffc400"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)" stroke="#e4002b" stroke-width="6"/>
  <use href="#keys" filter="url(#glow)" opacity="0.8"/>
  <use href="#keys"/>
</svg>
