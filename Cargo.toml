[package]
name = "omen-control"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Desktop UI for the omen-rgb-keyboard driver: HP OMEN keyboard lighting and fan control"
repository = "https://github.com/d-rk/omen-control"
rust-version = "1.88"

[dependencies]
iced = { version = "0.14", features = ["canvas", "tokio", "advanced"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
directories = "6"
thiserror = "2"
tempfile = "3"

[package.metadata.deb]
maintainer = "Dirk Wilden <dirkwilden@gmail.com>"
section = "utils"
extended-description = """\
Keyboard lighting (four zones, animation modes, gradients) and fan control (thermal profile, fan curves, power \
limits) for HP OMEN laptops. Needs the omen-rgb-keyboard kernel driver, which is installed separately."""
depends = "$auto, libxkbcommon0, libwayland-client0"
recommends = "libvulkan1, libegl1"
assets = [
    ["target/release/omen-control", "usr/bin/", "755"],
    ["data/omen-control.desktop", "usr/share/applications/", "644"],
    ["data/omen-control.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/omen-control/", "644"],
]

[profile.release]
lto = "thin"
strip = true
